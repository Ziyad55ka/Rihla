name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build without Supabase credentials
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.1"
          python-version: "3.12.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Test without Supabase credentials
        run: uv run --locked pytest

  database:
    name: Local PostgreSQL permission checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - name: Install locked database test dependencies
        run: npm ci --ignore-scripts
      - name: Apply migrations and test RLS locally without credentials
        run: npm test
